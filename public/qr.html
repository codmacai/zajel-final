<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zajel - Connect With Us</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #014524;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #ffffff;
      border: 1.5px solid #e8f5e9;
      border-radius: 28px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(34,139,34,0.08), 0 2px 8px rgba(0,0,0,0.04);
    }

    /* ── Logo ── */
    .logo-wrap {
      margin-bottom: 10px;
    }
    .logo-wrap img {
      height: 64px;
      width: auto;
      object-fit: contain;
    }

    .tagline {
      color: #6b7c6b;
      font-size: 13.5px;
      margin-bottom: 36px;
      letter-spacing: 0.1px;
    }

    /* ── Section label ── */
    .section-label {
      color: #9eb99e;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin-bottom: 14px;
      text-align: left;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: #e8f5e9;
      margin: 28px 0;
    }

    /* ── Social row ── */
    .social-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .social-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-decoration: none;
    }

    .social-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #f2faf2;
      border: 1.5px solid #d4ecd4;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
    }

    .social-btn:hover .social-icon {
      background: #e0f5e0;
      border-color: #22b222;
      transform: translateY(-2px);
    }

    .social-icon svg {
      width: 22px;
      height: 22px;
      fill: #1a5c1a;
    }

    .social-label {
      color: #6b7c6b;
      font-size: 11px;
      font-weight: 500;
    }

    /* ── Link buttons ── */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: #f7fdf7;
      border: 1.5px solid #daeeda;
      border-radius: 14px;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
    }

    .link-btn:hover {
      background: #eaf7ea;
      border-color: #36c236;
      transform: translateY(-1px);
    }

    .link-btn .icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-website { background: linear-gradient(135deg, #22b222, #36c236); }
    .icon-android { background: linear-gradient(135deg, #3ddc84, #22b222); }
    .icon-ios     { background: linear-gradient(135deg, #1a5c1a, #2e8b2e); }

    .link-btn .icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .link-text { text-align: left; flex: 1; }

    .link-title {
      color: #1a3a1a;
      font-size: 14px;
      font-weight: 600;
    }

    .link-sub {
      color: #7a967a;
      font-size: 12px;
      margin-top: 1px;
    }

    .link-arrow {
      color: #aecfae;
      font-size: 18px;
      font-weight: 300;
    }

    /* ── Footer ── */
    .footer {
      color: #b0c8b0;
      font-size: 11.5px;
      margin-top: 32px;
    }
  </style>
</head>
